<title>✨ 曹璐</title>
<style>
:root{--gold:#c9a74b;--gold-light:#e8d48b;--rose:#d4a0a0;--bg:#07060a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);width:100vw;height:100vh;height:100dvh;overflow:hidden;font-family:'Songti SC','Noto Serif SC','STSong','SimSun',serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;pointer-events:none}

.cine{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;transition:opacity .6s}
.cine::before,.cine::after{content:'';position:fixed;left:0;width:100%;background:#000;transition:height .8s cubic-bezier(.4,0,.2,1)}
.cine::before{top:0;height:0}.cine::after{bottom:0;height:0}
.cine.on::before,.cine.on::after{height:max(6vh,44px)}

#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s,visibility .8s}
#loader.hide{opacity:0;visibility:hidden}
.loader-diamond{width:36px;height:36px;background:var(--gold);transform:rotate(45deg);animation:ld .9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ld{0%{transform:rotate(45deg) scale(.75);opacity:.4}50%{transform:rotate(45deg) scale(1.2);opacity:1}100%{transform:rotate(45deg) scale(.75);opacity:.4}}

.scene{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;opacity:0;pointer-events:none;transition:opacity 1s cubic-bezier(.4,0,.2,1)}
.scene.active{opacity:1;pointer-events:auto}
.scene .inner{text-align:center;padding:32px}

/* Text pages (S1-S6) */
/* Lyrics pages — staggered line-by-line reveal */
.lyric-wrap{text-align:center}
.lyric-stagger{display:block;font-size:clamp(1.2rem,3vw,1.8rem);color:rgba(245,240,235,.82);font-weight:300;letter-spacing:clamp(2px,1.2vw,6px);line-height:2.4;opacity:0;animation:lyricUp .9s var(--d,.2s) cubic-bezier(.22,.61,.36,1) forwards}
.lyric-stagger b{color:var(--rose);font-weight:500}
@keyframes lyricUp{from{opacity:0;filter:blur(4px);transform:translateY(36px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}

.s1-text{font-size:clamp(3.5rem,10vw,7rem);font-weight:700;color:#f5f0eb;letter-spacing:clamp(12px,4vw,28px);animation:txtIn 1.4s .3s cubic-bezier(.22,.61,.36,1) both}

/* I love you page */
.ily-text{font-size:clamp(4rem,13vw,9rem);font-weight:900;color:var(--rose);letter-spacing:clamp(6px,3vw,18px);text-shadow:0 0 80px rgba(212,160,160,.5);animation:ilyPulse 2.2s .5s ease-in-out infinite}
@keyframes ilyPulse{0%,100%{text-shadow:0 0 60px rgba(212,160,160,.4);transform:scale(1)}40%{text-shadow:0 0 120px rgba(212,160,160,.7),0 0 200px rgba(201,167,75,.3);transform:scale(1.03)}}

/* 3D containers */
.scene canvas{border-radius:16px;box-shadow:0 0 80px rgba(201,167,75,.08)}

/* Proposal */
.s9-q{font-size:clamp(1.8rem,4.5vw,2.8rem);color:#f5f0eb;font-weight:300;letter-spacing:clamp(3px,2vw,10px);margin-bottom:48px}
.s9-btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;animation:txtIn 1s .5s both}
.s9-btn{display:inline-block;padding:18px 42px;border-radius:60px;border:1.5px solid var(--gold);background:rgba(201,167,75,.04);color:var(--gold);font-family:inherit;font-size:1.1rem;font-weight:500;cursor:pointer;letter-spacing:5px;transition:all .4s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none}
@media(hover:hover){.s9-btn:hover{background:var(--gold);color:#1a1a1a;transform:scale(1.04);box-shadow:0 0 60px rgba(201,167,75,.4)}}
.s9-btn:active{background:var(--gold);color:#fff;transform:scale(.94);box-shadow:0 0 60px rgba(201,167,75,.5)}

/* Fireworks */
.fw-title{font-size:clamp(2rem,5vw,3.5rem);color:#f5f0eb;font-weight:700;letter-spacing:clamp(4px,2vw,8px);opacity:0;animation:fwIn 1.5s 1s forwards}
.fw-sub{color:rgba(245,240,235,.35);font-size:1rem;margin-top:14px;letter-spacing:5px;opacity:0;animation:fwIn 1.5s 2s forwards}
@keyframes fwIn{to{opacity:1}}

.float-el{position:fixed;pointer-events:none;z-index:25;animation:floatUp 3.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.4) rotate(0deg)}20%{opacity:1;transform:translateY(-12vh) scale(1.2) rotate(15deg)}100%{opacity:0;transform:translateY(-52vh) scale(.5) rotate(-25deg)}}

/* Envelope */
.env-wrap{display:flex;align-items:center;justify-content:center;flex-direction:column}
.env-body{position:relative;width:clamp(240px,55vw,340px);height:clamp(160px,38vw,230px);background:linear-gradient(170deg,#faf7f2,#ebe0d0);border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.env-flap{position:absolute;top:0;left:0;width:100%;height:55%;background:linear-gradient(170deg,#ebe0d0,#d8c8a8);clip-path:polygon(0 0,50% 100%,100% 0);transform-origin:top center;z-index:2;border-radius:8px 8px 0 0}
.env-flap.open{animation:flapOpen 1s .5s cubic-bezier(.4,0,.55,1) forwards}
@keyframes flapOpen{0%{transform:perspective(600px) rotateX(0)}100%{transform:perspective(600px) rotateX(-175deg)}}
.env-msg{font-size:clamp(1.3rem,3vw,1.8rem);color:#5a4030;font-weight:400;letter-spacing:3px;opacity:0;animation:envMsgIn .8s 1.2s forwards}
@keyframes envMsgIn{to{opacity:1}}

/* Ring emoji */
.ring-emoji{font-size:clamp(8rem,28vw,18rem);animation:ringPulse 1.8s ease-in-out infinite;filter:drop-shadow(0 0 60px rgba(255,215,0,.5)) drop-shadow(0 0 120px rgba(255,180,50,.3))}
@keyframes ringPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 50px rgba(255,215,0,.4)) drop-shadow(0 0 100px rgba(255,180,50,.2))}50%{transform:scale(1.08);filter:drop-shadow(0 0 80px rgba(255,215,0,.7)) drop-shadow(0 0 160px rgba(255,180,50,.45))}}

<script>
// ============================================================
// GLOBALS
// ============================================================
let W = innerWidth, H = innerHeight;
const dpr = Math.min(devicePixelRatio, 2);
addEventListener('resize',()=>{W=innerWidth;H=innerHeight});

const bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
const fwC=document.getElementById('fw-canvas'),fwX=fwC.getContext('2d');

function setCanvas(c,w,h){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px'}
setCanvas(bgC,W,H);setCanvas(fwC,W,H);
addEventListener('resize',()=>{setCanvas(bgC,innerWidth,innerHeight);setCanvas(fwC,innerWidth,innerHeight)});

// ============================================================
// BACKGROUND STARS
// ============================================================
const stars=[];
for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.15+Math.random()*2.2,a:.1+Math.random()*.5,tw:Math.random()*Math.PI*2,ts:.4+Math.random()*3,vx:(Math.random()-.5)*.04,vy:(Math.random()-.5)*.04});
const nebulae=[];
for(let i=0;i<5;i++)nebulae.push({x:Math.random()*W,y:Math.random()*H,r:120+Math.random()*280,a:.008+Math.random()*.03,c:['#c9a74b','#d4a0a0','#7a8ab0','#a08060','#90a0b0'][i],vx:(Math.random()-.5)*.06,vy:(Math.random()-.5)*.04});

(function bgLoop(){bgX.clearRect(0,0,bgC.width,bgC.height);const t=Date.now()*.001;
for(const n of nebulae){n.x+=n.vx;n.y+=n.vy;if(n.x<-n.r)n.x=W+n.r;if(n.x>W+n.r)n.x=-n.r;if(n.y<-n.r)n.y=H+n.r;if(n.y>H+n.r)n.y=-n.r;const g=bgX.createRadialGradient(n.x*dpr,n.y*dpr,0,n.x*dpr,n.y*dpr,n.r*dpr);const ah=Math.floor(n.a*255).toString(16).padStart(2,'0');g.addColorStop(0,n.c+ah);g.addColorStop(.5,n.c+'08');g.addColorStop(1,'transparent');bgX.fillStyle=g;bgX.fillRect(0,0,bgC.width,bgC.height)}
for(const s of stars){s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;const f=s.a+.06*Math.sin(t*s.ts+s.tw);bgX.beginPath();bgX.arc(s.x*dpr,s.y*dpr,s.r*dpr,0,Math.PI*2);bgX.fillStyle=`rgba(245,240,235,${f})`;bgX.fill();if(s.r>1.2){bgX.beginPath();bgX.arc(s.x*dpr,s.y*dpr,s.r*3*dpr,0,Math.PI*2);bgX.fillStyle=`rgba(245,240,235,${f*.08})`;bgX.fill()}}
requestAnimationFrame(bgLoop)})();

// ============================================================
// SCENE MANAGEMENT
// ============================================================
var cur=0;
const scenes={};
for(let i=1;i<=12;i++)scenes[i]=document.getElementById('s'+i);
const cine=document.getElementById('cine');

function go(from,to){
  cine.classList.add('on');setTimeout(()=>cine.classList.remove('on'),900);
  if(from)scenes[from].classList.remove('active');
  scenes[to].classList.add('active');
  cur=to;
  if(to===1){setTimeout(()=>document.getElementById('envFlap').classList.add('open'),400)}
  if(to===8)spawnFloatEls(60);
  if(to===9){spawnFloatEls(30);setTimeout(()=>{if(cur===9)go(9,10)},6000)}
  if(to===10){startRoseVR();}
  if(to===11)spawnFloatEls(40);
  if(to===12){stopRoseVR();startFireworks()}
}

function spawnFloatEls(count){
  const emojis=['✨','💫','🌟','💕','💖','💗','💝','🕊️','💎','🌸'];
  for(let i=0;i<count;i++){const el=document.createElement('div');el.className='float-el';el.textContent=emojis[i%emojis.length];el.style.left=(2+Math.random()*96)+'vw';el.style.top=(30+Math.random()*50)+'vh';el.style.fontSize=(1+Math.random()*3.5)+'rem';el.style.animationDuration=(2.4+Math.random()*4)+'s';el.style.animationDelay=Math.random()*1.8+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),6000)}
}

// ============================================================
// BGM
// ============================================================
const bgm=document.createElement('audio');
bgm.src='music.m4a';bgm.loop=true;bgm.preload='auto';bgm.volume=.6;document.body.appendChild(bgm);
let musicOn=true;
bgm.play().catch(()=>{musicOn=false;document.addEventListener('click',function r(){bgm.play();musicOn=true;document.removeEventListener('click',r)},{once:true})});
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// S10: 3D ROSE BOUQUET VR — premium detailed rose
// ============================================================
let roseData=null;

// High-poly realistic rose petal with complex 3D curvature
function createPetalGeo(w, h, cu, crl){
  const sw=16, sh=14; // high segment count for smooth curves
  const shape=new THREE.Shape();
  // Realistic obovate petal: narrow base, wide middle, rounded tip
  shape.moveTo(0, -h*0.04);
  shape.bezierCurveTo(w*0.22, h*0.02, w*0.54, h*0.06, w*0.88, h*0.22);
  shape.bezierCurveTo(w*1.08, h*0.35, w*1.12, h*0.55, w*0.72, h*0.74);
  shape.bezierCurveTo(w*0.35, h*0.92, w*0.05, h*1.0, 0, h*1.02);
  shape.bezierCurveTo(-w*0.05, h*1.0, -w*0.35, h*0.92, -w*0.72, h*0.74);
  shape.bezierCurveTo(-w*1.12, h*0.55, -w*1.08, h*0.35, -w*0.88, h*0.22);
  shape.bezierCurveTo(-w*0.54, h*0.06, -w*0.22, h*0.02, 0, -h*0.04);

  const geo=new THREE.ShapeGeometry(shape, sw, sh);
  const pa=geo.attributes.position;

  // Apply complex 3D curvature
  for(let i=0; i<pa.count; i++){
    const x=pa.getX(i), y=pa.getY(i);
    const t = (y/h + 0.04) / 1.06; // normalized 0..1 from base to tip
    const rx = Math.abs(x/w);
    // Cup curvature: strongest near base, decreases outward
    let z = cu * Math.pow(t, 1.8) * (1 - rx*0.4) * (1 - rx);
    // Backward curl near the tip edge
    z -= crl * Math.pow(Math.max(0, t-0.45), 2.2) * Math.pow(rx, 2.5);
    // Gentle wavy ruffle along edges
    z += 0.012 * Math.sin(rx*12) * t * (1 - t*0.7);
    pa.setZ(i, z);
  }
  geo.computeVertexNormals();
  return geo;
}

// Vertex-colored petal material for gradient (dark at base → rich red at tip)
function createPetalGeoWithColors(w, h, cu, crl, colorBase, colorTip){
  const sw=16, sh=14;
  const shape=new THREE.Shape();
  shape.moveTo(0, -h*0.04);
  shape.bezierCurveTo(w*0.22, h*0.02, w*0.54, h*0.06, w*0.88, h*0.22);
  shape.bezierCurveTo(w*1.08, h*0.35, w*1.12, h*0.55, w*0.72, h*0.74);
  shape.bezierCurveTo(w*0.35, h*0.92, w*0.05, h*1.0, 0, h*1.02);
  shape.bezierCurveTo(-w*0.05, h*1.0, -w*0.35, h*0.92, -w*0.72, h*0.74);
  shape.bezierCurveTo(-w*1.12, h*0.55, -w*1.08, h*0.35, -w*0.88, h*0.22);
  shape.bezierCurveTo(-w*0.54, h*0.06, -w*0.22, h*0.02, 0, -h*0.04);

  const geo=new THREE.ShapeGeometry(shape, sw, sh);
  const pa=geo.attributes.position;
  const ca=new Float32Array(pa.count*3);

  for(let i=0; i<pa.count; i++){
    const x=pa.getX(i), y=pa.getY(i);
    const t=(y/h+0.04)/1.06;
    const rx=Math.abs(x/w);
    let z=cu*Math.pow(t,1.8)*(1-rx*0.4)*(1-rx);
    z-=crl*Math.pow(Math.max(0,t-0.45),2.2)*Math.pow(rx,2.5);
    z+=0.012*Math.sin(rx*12)*t*(1-t*0.7);
    pa.setZ(i,z);

    // Color gradient: dark at base → tip color
    const f=Math.pow(t, 0.6);
    ca[i*3]=colorBase[0]+(colorTip[0]-colorBase[0])*f;
    ca[i*3+1]=colorBase[1]+(colorTip[1]-colorBase[1])*f;
    ca[i*3+2]=colorBase[2]+(colorTip[2]-colorBase[2])*f;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(ca, 3));
  geo.computeVertexNormals();
  return geo;
}

function createRose(){
  const g=new THREE.Group();

  // Deep burgundy base, bright crimson-red tip
  const base=[0.35, 0.02, 0.05];   // dark wine
  const tip=[0.82, 0.08, 0.18];    // vivid red
  const matPetal=new THREE.MeshStandardMaterial({color:'#cc2244', roughness:.42, metalness:.02, vertexColors:true});

  // Many layers for realistic bloom — inner bud to open outer petals
  const layers=[
    // inner bud — tiny tight petals
    {n:5, w:.08, h:.22, cu:.10, crl:.01, ang:.08, tilt:.12},
    {n:6, w:.11, h:.30, cu:.14, crl:.02, ang:.16, tilt:.22},
    {n:7, w:.15, h:.38, cu:.18, crl:.03, ang:.28, tilt:.34},
    // mid bloom
    {n:8, w:.20, h:.48, cu:.24, crl:.06, ang:.42, tilt:.48},
    {n:9, w:.25, h:.56, cu:.28, crl:.09, ang:.56, tilt:.62},
    {n:11, w:.30, h:.64, cu:.32, crl:.12, ang:.72, tilt:.74},
    // outer petals — wide open
    {n:12, w:.36, h:.72, cu:.34, crl:.16, ang:.88, tilt:.84},
    {n:14, w:.42, h:.80, cu:.35, crl:.20, ang:1.02, tilt:.92},
    {n:15, w:.48, h:.88, cu:.36, crl:.25, ang:1.18, tilt:.98},
    {n:16, w:.54, h:.95, cu:.36, crl:.30, ang:1.36, tilt:1.05},
  ];

  layers.forEach(l=>{
    for(let i=0; i<l.n; i++){
      const geo=createPetalGeoWithColors(l.w, l.h, l.cu, l.crl, base, tip);
      const petal=new THREE.Mesh(geo, matPetal);
      const a=(i/l.n)*Math.PI*2 + (Math.random()-.5)*0.25;
      petal.position.y=-l.h*0.06;
      petal.rotation.z=Math.cos(a)*l.tilt;
      petal.rotation.x=Math.sin(a)*l.tilt;
      petal.rotation.y=a;
      g.add(petal);
    }
  });

  return g;
}

window.startRoseVR=function(){
  if(roseData)return;
  const container=document.getElementById('rosevr');
  const size=Math.min(W,H)*.94;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color('#07060a');
  scene.fog=new THREE.Fog('#07060a',2.5,16);

  const cam=new THREE.PerspectiveCamera(38,1,.1,50);
  cam.position.set(0,.8,3.8);cam.lookAt(0,.2,0);

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(size,size);renderer.setPixelRatio(Math.min(dpr,2));
  renderer.shadowMap.enabled=true;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
  container.appendChild(renderer.domElement);

  // Beautiful rim + key lighting
  scene.add(new THREE.AmbientLight('#2a1a22',1.8));
  const key=new THREE.DirectionalLight('#ffe8d0',5.5);key.position.set(4,6,7);scene.add(key);
  const fill=new THREE.DirectionalLight('#ff99aa',2.5);fill.position.set(-4,2,-3);scene.add(fill);
  const rimLight=new THREE.DirectionalLight('#aaccff',2.2);rimLight.position.set(0,-1,5);scene.add(rimLight);
  const topLight=new THREE.PointLight('#ffccaa',15,10);topLight.position.set(0,3.5,1);scene.add(topLight);

  // Controls
  const controls=new OrbitControls(cam,renderer.domElement);
  controls.target.set(0,.15,0);controls.enableDamping=true;controls.dampingFactor=.06;
  controls.autoRotate=true;controls.autoRotateSpeed=.6;
  controls.minDistance=2.0;controls.maxDistance=10;controls.maxPolarAngle=Math.PI*.78;
  controls.update();

  // Large centerpiece rose
  const centerRose=createRose();
  centerRose.scale.setScalar(2.6);
  scene.add(centerRose);

  // 2 smaller accent roses
  for(let si=0; si<2; si++){
    const sr=createRose();
    const sx=(si===0?1.1:-1.1), sz=(si===0?.4:-.3);
    sr.position.set(sx, -.25, sz);
    sr.scale.setScalar(1.5);
    sr.rotation.y=si*Math.PI*.7;
    scene.add(sr);
  }

  // Stems for accent roses
  const stemMat=new THREE.MeshStandardMaterial({color:'#1d4a12',roughness:.5});
  const stemPos=[[1.1,-.25,.4],[-1.1,-.25,-.3]];
  stemPos.forEach(([sx,sy,sz])=>{
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,1.8,12),stemMat);
    st.position.set(sx,sy-1.1,sz);scene.add(st);
  });
  // Center rose stem
  const cs=new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,2.0,12),stemMat);
  cs.position.set(0,-1.3,0);scene.add(cs);

  // Text sprite — floating above
  const tc=document.createElement('canvas');tc.width=512;tc.height=128;
  const tx=tc.getContext('2d');tx.fillStyle='#f5f0eb';tx.font='bold 44px "Songti SC","Noto Serif SC",serif';tx.textAlign='center';tx.fillText('你为玫瑰花费的时间',256,52);
  tx.fillText('才让她变得如此重要',256,100);
  const tt=new THREE.CanvasTexture(tc);tt.minFilter=THREE.LinearFilter;
  const textSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tt,transparent:true,opacity:.9}));
  textSprite.position.set(0,2.2,0);textSprite.scale.set(2.0,.5,1);scene.add(textSprite);

  // Fireflies
  const pc=120;const pg=new THREE.BufferGeometry();const pp=new Float32Array(pc*3);const pd=[];
  for(let i=0;i<pc;i++){const a=Math.random()*Math.PI*2,rd=.5+Math.random()*3.0,ht=-.8+Math.random()*3.2;pp[i*3]=Math.cos(a)*rd;pp[i*3+1]=ht;pp[i*3+2]=Math.sin(a)*rd;pd.push({ba:a,br:rd,h:ht,sp:.25+Math.random()*.9,ph:Math.random()*Math.PI*2})}
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  const pmat=new THREE.PointsMaterial({color:'#ffd700',size:.03,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7});
  const pts=new THREE.Points(pg,pmat);scene.add(pts);

  // Ground glow
  const sg=new THREE.PlaneGeometry(8,8);
  const sm=new THREE.ShaderMaterial({uniforms:{uT:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform float uT;void main(){float d=length(vUv-.5)*2.;float a=smoothstep(1.,0.,d)*.12;gl_FragColor=vec4(1.,.84,0,a*(.7+.3*sin(uT*1.5)));}`,transparent:true,depthWrite:false});
  const sp=new THREE.Mesh(sg,sm);sp.rotation.x=-Math.PI/2;sp.position.y=-2.0;scene.add(sp);

  roseData={scene,cam,renderer,controls,centerRose,textSprite,pts,pg,pp,pd,pc,sm,startTime:performance.now()};

  setTimeout(()=>{if(window.cur===10)window.go(10,11)},16000);
  const s10el=document.getElementById('s10');
  s10el.addEventListener('click',function sk(){if(window.cur===10)window.go(10,11);s10el.removeEventListener('click',sk)});

  function anim(ts){
    if(!roseData)return;
    roseData.fid=requestAnimationFrame(anim);
    const et=(ts-roseData.startTime)*.001;
    roseData.controls.update();
    roseData.sm.uniforms.uT.value=et;
    roseData.textSprite.position.y=2.2+Math.sin(et*1.3)*.12;

    const pa=roseData.pg.attributes.position.array;
    for(let i=0;i<roseData.pc;i++){const d=roseData.pd[i];d.ba+=d.sp*.003;const a=d.ba,rd=d.br+Math.sin(et*2+d.ph)*.25;d.h+=Math.sin(et*2.5+d.ph)*.0015;if(d.h>2.5)d.h=-.8;if(d.h<-.8)d.h=2.5;pa[i*3]=Math.cos(a)*rd;pa[i*3+1]=d.h;pa[i*3+2]=Math.sin(a)*rd}
    roseData.pg.attributes.position.needsUpdate=true;
    roseData.renderer.render(roseData.scene,roseData.cam);
  }
  roseData.fid=requestAnimationFrame(anim);
};

window.stopRoseVR=function(){
  if(!roseData)return;
  cancelAnimationFrame(roseData.fid);
  roseData.renderer.domElement.remove();
  roseData=null;
};
</script>

<script>
// ============================================================
// S10: ANSWER → CONFETTI

window.answer=function(){
  spawnFloatEls(120);
  for(let i=0;i<140;i++){const cf=document.createElement('div');cf.style.cssText=['position:fixed;pointer-events:none;z-index:30','width:'+(3+Math.random()*12)+'px','height:'+(3+Math.random()*12)+'px','background:'+['#c9a74b','#e8d48b','#d4a0a0','#ff6b8a','#f5f0eb','#ffb8c6','#b8d0e8'][Math.floor(Math.random()*7)],'border-radius:'+(Math.random()>.5?'50%':'2px'),'left:'+(15+Math.random()*70)+'vw','top:'+(15+Math.random()*60)+'vh','animation:cfFall '+(2+Math.random()*4)+'s ease-in forwards','animation-delay:'+Math.random()*.8+'s','--cx:'+(Math.random()-.5)*200+'px','--cy:'+(Math.random()-.5)*200+'px','--ex:'+(Math.random()-.5)*500+'px','--ey:'+(-50-Math.random()*450)+'px','--cr:'+Math.random()*360+'deg','--er:'+Math.random()*720+'deg'].join(';');document.body.appendChild(cf);setTimeout(()=>cf.remove(),4500)}
  setTimeout(()=>go(11,12),1400);
};
const cs=document.createElement('style');cs.textContent='@keyframes cfFall{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}20%{opacity:1;transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(1.2)}100%{opacity:0;transform:translate(var(--ex),var(--ey)) rotate(var(--er)) scale(.3)}}';document.head.appendChild(cs);

// ============================================================
// S11: FIREWORKS

function startFireworks(){
  fwC.style.zIndex='15';
  const FC=['#ff2d55','#ff6b8a','#ff9f43','#feca57','#ff6b6b','#ff4757','#ff7979','#ff4081','#e040fb','#7c4dff','#40c4ff','#69f0ae','#ffab40','#ffd740','#ff5252','#ea80fc','#b2ff59','#ff1744'];
  const rc=()=>FC[Math.floor(Math.random()*FC.length)];
  const rockets=[],sparks=[],secondStage=[];
  const st=performance.now();
	  // Colored Disney-style castle — bottom 1/4 of screen
	  function drawCastle(){
	    const cx=W/2, by=H, cw=Math.min(W*.78, H*.42), ch=H*.28;
	    const gx=cx-cw*.5, gy=by-ch;
	    // Sky glow behind castle
	    (function(ctx){const g=ctx.createRadialGradient(cx*dpr,gy*dpr,0,cx*dpr,gy*dpr,ch*dpr*2);g.addColorStop(0,'rgba(30,20,50,.25)');g.addColorStop(.5,'rgba(20,15,40,.12)');g.addColorStop(1,'rgba(7,6,10,0)');ctx.fillStyle=g;ctx.fillRect(gx*dpr,0,cw*dpr,by*dpr)})(fwX);
	    function tower(tx,ty,tw,th,rh,rc,wc){
	      fwX.fillStyle=rc;
	      fwX.beginPath();fwX.moveTo((tx-tw*.08)*dpr,ty*dpr);fwX.lineTo((tx+tw*.5)*dpr,(ty-rh)*dpr);fwX.lineTo((tx+tw+tw*.08)*dpr,ty*dpr);fwX.closePath();fwX.fill();
	      fwX.fillRect((tx-tw*.02)*dpr,(ty-rh*.25)*dpr,(tw+tw*.04)*dpr,rh*.28*dpr);
	      fwX.fillStyle=wc;fwX.fillRect(tx*dpr,ty*dpr,tw*dpr,(by-ty)*dpr);
	      fwX.fillStyle=rc;
	      for(let cx2=tx;cx2<tx+tw-tw*.12;cx2+=tw*.12)fwX.fillRect(cx2*dpr,(ty-th*.03)*dpr,tw*.08*dpr,th*.06*dpr);
	    }
	    const rb='#4a7eb5',rd='#2d5a8a',wc2='#eadcc8',wd='#d4c4a8',gld='#c9a74b',pr='#c47a9a';
	    const mtw=cw*.18,mtx=cx-mtw*.5,mty=gy+ch*.08,mth=ch*.62;
	    tower(mtx,mty,mtw,mth,ch*.45,rb,wc2);
	    fwX.fillStyle=gld;fwX.beginPath();fwX.moveTo((cx-cw*.01)*dpr,mty*dpr);fwX.lineTo(cx*dpr,(mty-ch*.55)*dpr);fwX.lineTo((cx+cw*.01)*dpr,mty*dpr);fwX.closePath();fwX.fill();
	    fwX.fillStyle='#e8a0b0';fwX.beginPath();fwX.moveTo(cx*dpr,(mty-ch*.52)*dpr);fwX.lineTo((cx+cw*.04)*dpr,(mty-ch*.47)*dpr);fwX.lineTo(cx*dpr,(mty-ch*.44)*dpr);fwX.closePath();fwX.fill();
	    const ltw=cw*.14,ltx=gx+cw*.05,lty=gy+ch*.32,lth=ch*.4;
	    tower(ltx,lty,ltw,lth,ch*.3,pr,wd);
	    tower(gx+cw*.79,gy+ch*.32,cw*.14,ch*.4,ch*.3,pr,wd);
	    tower(gx+cw*.02,gy+ch*.48,cw*.08,ch*.25,ch*.18,rd,wd);
	    tower(gx+cw*.88,gy+ch*.48,cw*.08,ch*.25,ch*.18,rd,wd);
	    fwX.fillStyle=wc2;fwX.fillRect((ltx+ltw)*dpr,(gy+ch*.48)*dpr,(mtx-ltx-ltw)*dpr,(by-gy-ch*.48)*dpr);
	    fwX.fillRect((mtx+mtw)*dpr,(gy+ch*.48)*dpr,(gx+cw*.79-mtx-mtw)*dpr,(by-gy-ch*.48)*dpr);
	    fwX.fillStyle='#1a1020';fwX.beginPath();fwX.arc(cx*dpr,(gy+ch*.62)*dpr,cw*.07*dpr,Math.PI,0);fwX.fill();
	    fwX.fillStyle=gld;fwX.fillRect((cx-cw*.07)*dpr,(gy+ch*.62)*dpr,cw*.14*dpr,cw*.015*dpr);
	    fwX.fillStyle='rgba(255,220,160,.55)';const ww=cw*.022,wh=ch*.05;
	    for(let wy=mty+ch*.08;wy<mty+mth-ch*.08;wy+=ch*.12){fwX.fillRect((cx-ww*1.4)*dpr,wy*dpr,ww*dpr,wh*dpr);fwX.fillRect((cx+ww*.4)*dpr,wy*dpr,ww*dpr,wh*dpr)}
	    for(let wy=lty+ch*.08;wy<lty+lth-ch*.08;wy+=ch*.14)fwX.fillRect((ltx+ltw*.35)*dpr,wy*dpr,ww*dpr,wh*dpr);
	    for(let wy=gy+ch*.4;wy<gy+ch*.4+lth-ch*.08;wy+=ch*.14)fwX.fillRect((gx+cw*.79+cw*.14*.35)*dpr,wy*dpr,ww*dpr,wh*dpr);
	    fwX.fillStyle='rgba(255,200,180,.5)';fwX.beginPath();fwX.arc(cx*dpr,(gy+ch*.38)*dpr,cw*.025*dpr,0,Math.PI*2);fwX.fill();
	  }

  function launch(x,tY,color,speed){rockets.push({x,y:H,targetY:tY,speed:speed||(4+Math.random()*9),color,trail:[]})}
  function burst(x,y,color,type,size=1){
    if(type==='ring'){const n=40+Math.floor(Math.random()*60);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;sparks.push({x,y,vx:Math.cos(a)*(3+Math.random()*8)*size,vy:Math.sin(a)*(3+Math.random()*8)*size,life:1,decay:.006+.018*Math.random(),color,size:.5+Math.random()*3.2})}}
    else if(type==='double-ring'){for(let r=0;r<2;r++){const n=30+Math.floor(Math.random()*40),rr=(3+r*2.2)*size;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rr+Math.random()*2.5;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.006+.016*Math.random(),color:r===0?color:rc(),size:.4+Math.random()*2.8})}}}
    else if(type==='willow'){for(let i=0;i<55;i++){const a=(Math.random()-.5)*Math.PI*.8-Math.PI/2;sparks.push({x,y,vx:Math.cos(a)*(2+Math.random()*6)*size,vy:Math.sin(a)*(2+Math.random()*6)*size,life:1.3,decay:.003+.008*Math.random(),color:rc(),size:.4+Math.random()*3})}}
    else if(type==='spiral'){for(let i=0;i<70;i++){const a=i*Math.PI*2/18,s=3+Math.random()*4.5*size;sparks.push({x,y,vx:Math.cos(a)*s*.6,vy:Math.sin(a)*s*.6,life:1.1,decay:.004+.01*Math.random(),color,size:.4+Math.random()*2.8})}}
    else if(type==='crossette'){const n=5+Math.floor(Math.random()*7);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*6*size;const sx=x+Math.cos(a)*s,sy=y+Math.sin(a)*s;sparks.push({x:sx,y:sy,vx:0,vy:0,life:.35,decay:.014,color,size:2});secondStage.push({x:sx,y:sy,color,delay:.22+Math.random()*.3,size:size*.6})}}
    else if(type==='star'){for(let p=0;p<5;p++){const a=p*Math.PI*2/5-Math.PI/2;for(let j=0;j<16;j++){const sa=a+(Math.random()-.5)*.35,ss=(3.5+Math.random()*5)*size;sparks.push({x,y,vx:Math.cos(sa)*ss*(.3+Math.random()*.6),vy:Math.sin(sa)*ss*(.3+Math.random()*.6),life:1,decay:.006+.014*Math.random(),color,size:.4+Math.random()*3})}}}
    else{const n=60+Math.floor(Math.random()*120);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;sparks.push({x,y,vx:Math.cos(a)*(1.5+Math.random()*9)*size,vy:Math.sin(a)*(1.5+Math.random()*9)*size,life:1,decay:.005+.018*Math.random(),color,size:.6+Math.random()*4.5})}}
  }
  function heartBurst(x,y,color){const n=180;for(let i=0;i<n;i++){const t=i/n*Math.PI*2,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)),scale=2+Math.random()*3;sparks.push({x,y,vx:hx*scale,vy:hy*scale,life:1,decay:.007+.022*Math.random(),color:color||'#ff2d55',size:.8+Math.random()*4.5})}}
  const ht=[5,12,20,28,36,44,52,60,68,76,84,92,100];let lhi=-1;

  (function fwLoop(ts){
    const et=(ts-st)*.001;
    fwX.fillStyle='rgba(7,6,10,.12)';fwX.fillRect(0,0,fwC.width,fwC.height);
    drawCastle();
    let rate=.05;if(et>30)rate=.04;if(et>55)rate=.03;if(et>80)rate=.022;
    if(Math.random()<rate)launch(Math.random()*W,Math.random()*H*.48,rc());
    if(Math.random()<rate*.35){const cx=W*.2+Math.random()*W*.6,ty=Math.random()*H*.38;launch(cx,ty,rc());setTimeout(()=>launch(cx+30+Math.random()*110,ty+Math.random()*60,rc()),120);setTimeout(()=>launch(cx-30-Math.random()*110,ty+Math.random()*60,rc()),240)}
    const cs=Math.floor(et);for(const h of ht){if(cs>=h&&lhi<h){lhi=h;heartBurst(W/2+Math.random()*300-150,H*.18+Math.random()*160,'#ff2d55');setTimeout(()=>heartBurst(W/2+Math.random()*300-150,H*.22+Math.random()*140,'#ff6b8a'),350)}}
    if(et>88&&et<96&&Math.random()<.25){for(let j=0;j<5;j++){setTimeout(()=>{const types=['ring','star','crossette','double-ring','spiral','willow'];burst(W*.1+Math.random()*W*.8,H*.1+Math.random()*H*.35,rc(),types[j%6],.6+Math.random()*1.4)},j*110)}}
    for(let i=secondStage.length-1;i>=0;i--){const ss=secondStage[i];ss.delay-=.016;if(ss.delay<=0){burst(ss.x,ss.y,ss.color,'star',ss.size);secondStage.splice(i,1)}}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y-=r.speed;r.trail.push({x:r.x,y:r.y,life:1});if(r.trail.length>16)r.trail.shift();for(const tr of r.trail)tr.life-=.06;fwX.fillStyle='#fff';fwX.shadowColor='#fff';fwX.shadowBlur=16;fwX.beginPath();fwX.arc(r.x*dpr,r.y*dpr,3*dpr,0,Math.PI*2);fwX.fill();fwX.shadowBlur=0;for(const tr of r.trail){if(tr.life<=0)continue;fwX.fillStyle=`rgba(255,230,200,${tr.life*.6})`;fwX.beginPath();fwX.arc(tr.x*dpr,tr.y*dpr,2*dpr,0,Math.PI*2);fwX.fill()}if(r.y<=r.targetY){const types=['normal','normal','ring','willow','star','crossette','double-ring','spiral'];burst(r.x,r.y,r.color,types[Math.floor(Math.random()*types.length)]);rockets.splice(i,1)}}
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.045;s.vx*=.993;s.vy*=.993;s.life-=s.decay;if(s.life<=0){sparks.splice(i,1);continue}fwX.globalAlpha=s.life;fwX.fillStyle=s.color;fwX.shadowColor=s.color;fwX.shadowBlur=14;fwX.beginPath();fwX.arc(s.x*dpr,s.y*dpr,s.size*dpr,0,Math.PI*2);fwX.fill();fwX.globalAlpha=s.life*.15;fwX.beginPath();fwX.arc(s.x*dpr,s.y*dpr,s.size*3.5*dpr,0,Math.PI*2);fwX.fill()}fwX.globalAlpha=1;fwX.shadowBlur=0;
    if(et<105)requestAnimationFrame(fwLoop);
  })(performance.now());
}
